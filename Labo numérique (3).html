.err{color:var(--bad)}

svg{width:100%;height:auto;margin-top:8px}
</style>

[/r[ée]p[èée]t|plusieurs essais|plusieurs fois|essais? concordants?/i,"On répète les essais pour vérifier la répétabilité, repérer une erreur ou une valeur aberrante, et utiliser une moyenne plus fiable : l’erreur aléatoire diminue avec le nombre d’essais."],

[/[ée]talon primaire|NaOH.*(titre|[ée]talon)|soude.*(titre|[ée]talon)/i,"La soude n’est pas un étalon primaire : elle absorbe l’eau et le CO₂ de l’air, donc sa concentration réelle doit être vérifiée par un dosage avec un étalon primaire."],

[/beer|lambert|droite d.[ée]talonnage/i,"La loi de Beer-Lambert (A = ε·l·C) montre que l’absorbance est proportionnelle à la concentration dans un certain domaine : la droite d’étalonnage permet de déduire la concentration inconnue."],

[/mohr.*pH|chlorures.*pH/i,"Dans la méthode de Mohr, le pH doit rester voisin de la neutralité (environ 6,5 à 10) : en milieu acide l’ion chromate est transformé et le virage est faussé, en milieu trop basique Ag⁺ précipite sous forme d’oxyde d’argent."],

[/pH-?m[èe]tre.*[ée]talon|[ée]talonn.*pH-?m[èe]tre/i,"On étalonne le pH-mètre avec des solutions tampons (par exemple pH 4, 7 et 10) pour corriger la dérive de l’électrode et obtenir des mesures justes."],
